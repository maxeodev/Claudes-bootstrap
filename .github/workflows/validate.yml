name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-plugins:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Squelette Phase 0 : valide chaque plugin présent.
      # Les étapes d'installation de Claude Code et le gate d'éval
      # seront branchés au fur et à mesure des phases 1+.
      - name: Lister les bootstraps
        run: |
          if [ -d bootstraps ]; then
            find bootstraps -name plugin.json -print
          else
            echo "Aucun bootstrap pour l'instant (Phase 0)."
          fi

