name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-plugins:
    name: claude plugin validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Squelette Phase 0 : valide chaque plugin présent.
      # Les étapes d'installation de Claude Code et le gate d'éval
      # seront branchés au fur et à mesure des phases 1+.
      - name: Vérifier la syntaxe des plugin.json
        run: |
          found=0
          while IFS= read -r p; do
            found=1
            echo "→ $p"
            python3 -m json.tool "$p" > /dev/null
          done < <(find bootstraps -name plugin.json)
          if [ "$found" = "0" ]; then
            echo "Aucun plugin.json trouvé."
          fi

      # Étape complète (à activer une fois Claude Code installable en CI) :
